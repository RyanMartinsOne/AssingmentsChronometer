name: Generate Signed and Versioned Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract version from Git tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          echo "VERSION_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          VERSION_CODE=$(echo "$TAG_NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v3
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: --latest --strip all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: CHANGES.md

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build Release APK with injected version properties
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.get_version.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.get_version.outputs.VERSION_CODE }}"

      - name: Verify generated APK
        run: find app/build/outputs/apk/ -name "*.apk"

      - name: Sign the generated APK
        uses: r0adkll/sign-android-release@v1.0.4
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename signed APK
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" \
             "AssignmentsChronometer-v${{ steps.get_version.outputs.VERSION_NAME }}-signed.apk"

      - name: Create GitHub Release and attach the signed APK
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGES.md
          name: "Release v${{ steps.get_version.outputs.VERSION_NAME }}"
          files: AssignmentsChronometer-v${{ steps.get_version.outputs.VERSION_NAME }}-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}