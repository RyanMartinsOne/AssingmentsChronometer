name: Generate Signed and Versioned Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract version from Git tag
        id: get_version
        run: |
          # Removes the 'v' character from the tag name (e.g., v1.3.2 becomes 1.3.2)
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          echo "VERSION_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Converts the version into a clean integer for versionCode (e.g., 1.3.2 becomes 10302)
          VERSION_CODE=$(echo "$TAG_NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build Release APK with injected version properties
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.get_version.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.get_version.outputs.VERSION_CODE }}"

      - name: Custom Rename APK File
        run: |
          mkdir -p app/build/outputs/apk/custom_release
          
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/custom_release/AssignmentsChronometer-v${{ steps.get_version.outputs.VERSION_NAME }}.apk

      - name: Sign the generated APK with your keystore
        uses: r0adkll/sign-android-release@v1.0.4
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/custom_release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release and attach the signed APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "Release v${{ steps.get_version.outputs.VERSION_NAME }}"
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}