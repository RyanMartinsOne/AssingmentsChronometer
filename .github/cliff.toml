[changelog]
header = ""
body = """
## What's Changed {% if version %}in {{ version | trim_start_matches(pat="v") }}{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}
- {{ commit.message
    | trim_start_matches(pat="feat: ")
    | trim_start_matches(pat="fix: ")
    | trim_start_matches(pat="perf: ")
    | trim_start_matches(pat="refactor: ")
    | trim_start_matches(pat="style: ")
  }}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9]*"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 --> Features" },
  { message = "^fix", group = "<!-- 1 --> Bug Fixes" },
  { message = "^perf", group = "<!-- 2 --> Performance" },
  { message = "^refactor", group = "<!-- 3 --> Refactoring" },
  { message = "^style", group = "<!-- 4 --> Styling" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^docs", skip = true },
  { message = "^build", skip = true },
  { message = "^revert", skip = true }
]